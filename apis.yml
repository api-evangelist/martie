name: Martie
description: >-
  Martie is a woman-owned, San Francisco-based online discount grocery
  marketplace founded in 2021 to fight food waste and make quality goods
  accessible and affordable. Martie works directly with brands on their
  overstock, surplus, seasonal, and old-packaging inventory — pantry staples,
  beauty, and household goods — and resells it to consumers at up to 80% off
  retail with no membership or subscription required. Shoppers browse daily
  deals through the martie.com website or the Martie iOS and Android apps. The
  company reports having diverted over five million pounds of food from landfill
  since launch. Martie is a direct-to-consumer e-commerce brand (a Shopify-hosted
  storefront) and does not currently publish a public developer platform, API,
  or documentation surface; this profile was surfaced as a Seedcamp portfolio
  company and enriched with company identity plus a domain-security probe.
